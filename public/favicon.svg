<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Linear gradient representing a cosmic star/supernova -->
    <linearGradient id="novaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" /> <!-- Indigo -->
      <stop offset="50%" stop-color="#8B5CF6" /> <!-- Purple -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Pink/Rose -->
    </linearGradient>
    
    <!-- Outer glow for the nova star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sleek, dark squircle background for contrast on all browser tabs (dark & light modes) -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="#0F172A" />

  <!-- Outer cosmic orbital path / decorative crescent accent -->
  <path d="M 120 380 C 60 280 90 140 200 90 C 270 58 350 70 400 120" 
        fill="none" 
        stroke="url(#novaGradient)" 
        stroke-width="16" 
        stroke-linecap="round" 
        opacity="0.3" />

  <!-- Main Action Symbol: Stylized Checkmark that morphs into a glowing Star (Nova) -->
  <!-- Checkmark leg -->
  <path d="M 140 260 L 220 340 L 330 200" 
        fill="none" 
        stroke="url(#novaGradient)" 
        stroke-width="44" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing 4-pointed Nova Star at the top-right of the checkmark -->
  <path d="M 330 200 C 330 150 350 130 400 130 C 350 130 330 110 330 60 C 330 110 310 130 260 130 C 310 130 330 150 330 200 Z" 
        fill="#FFFFFF" 
        filter="url(#glow)" />

  <!-- Small secondary star accent -->
  <path d="M 200 180 C 200 165 205 160 220 160 C 205 160 200 155 200 140 C 200 155 195 160 180 160 C 195 160 200 165 200 180 Z" 
        fill="#38BDF8" />
</svg>
